<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <h2>Follwing is Ordered List</h2>
    <ol>
        <li>Apple</li>
        <li>Banana</li>
        <li>Carrot</li>
        <li>Orange</li>
    </ol>

    <h2>Follwing is Unordered List</h2>
    <ul>
        <li>Dog</li>
        <li>Cat</li>
        <li>Lion</li>
        <li>Tiger</li>
    </ul>

    <h2>Following is Description Lists</h2>
    <dl>
        <li>Wheat</li>
        <li>Jwar</li>
        <li>Bajara</li>
        <li>Maka</li>
    </dl>
</body>
</html>
