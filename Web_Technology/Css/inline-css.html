<!--Inline Css-->
<!DOCTYPE html>
<html>
<head>
    <title>Inline CSS Practice</title>
</head>

<body>

    <h1 style="color: blue;">Inline Css</h1>

    <p style="color: green; font-size: 20px;">
        Lorem, ipsum dolor sit amet consectetur adipisicing elit.
    </p>

    <button style="background-color: black; color: white; padding: 10px;">
        Click Me
    </button>

</body>
</html>

<!--Internal Css-->

<!DOCTYPE html>
<html>
<head>
    <title>Internal CSS Practice</title>

    <style>
        h1 {
            color: blue;
            text-align: center;
        }

        p {
            color: green;
            font-size: 20px;
        }

        button {
            background-color: black;
            color: white;
            padding: 10px;
        }
    </style>

</head>

<body>

    <h1>Internal Css</h1>
    <h2></h2>

    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit.</p>

    <button>Click Me</button>

</body>
</html>
