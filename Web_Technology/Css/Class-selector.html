<!DOCTYPE html>
<html>
<head>
    <title>Class Selector</title>

    <style>
        .red-text {
            color: red;
        }

        .box {
            background-color: lightblue;
            padding: 20px;
            margin: 10px;
        }
    </style>

</head>

<body>

    <h1 class="red-text">Welcome</h1>

    <p class="red-text">This is red.</p>

    <div class="box">
        This is Box 1
    </div>

    <div class="box">
        This is Box 2
    </div>

</body>
</html>
