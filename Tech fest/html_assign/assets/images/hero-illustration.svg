<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 375" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background grid -->
  <g opacity="0.05">
    <path d="M0 0h500v375H0z" fill="url(#grad1)"/>
  </g>

  <!-- Central laptop -->
  <g transform="translate(180, 80)">
    <!-- Laptop base -->
    <rect x="0" y="160" width="140" height="8" rx="4" fill="#1e293b"/>
    <rect x="10" y="168" width="120" height="4" rx="2" fill="#334155"/>

    <!-- Laptop screen -->
    <rect x="-10" y="10" width="160" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="0" y="20" width="140" height="130" rx="4" fill="#0a0f1a">
      <!-- Code lines -->
      <g fill="#00d4aa" font-family="monospace" font-size="11" opacity="0.9">
        <text x="15" y="45">const innovate = () => {</text>
        <text x="25" y="62">build.dreams();</text>
        <text x="25" y="77">create.future();</text>
        <text x="25" y="92">inspire.others();</text>
        <text x="15" y="109">};</text>
        <text x="15" y="126">innovate(); // 🚀</text>
      </g>
    </rect>
  </g>

  <!-- Floating elements around laptop -->
  <!-- AI Brain -->
  <g transform="translate(80, 100)" filter="url(#glow)">
    <circle cx="0" cy="0" r="35" fill="url(#grad1)" opacity="0.2"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="url(#grad1)" stroke-width="2"/>
    <path d="M-15 -5 Q0 -20 15 -5 Q20 5 15 15 Q0 25 -15 15 Q-20 5 -15 -5" fill="none" stroke="url(#grad1)" stroke-width="1.5" opacity="0.7"/>
    <circle cx="-8" cy="-2" r="3" fill="url(#grad1)"/>
    <circle cx="8" cy="-2" r="3" fill="url(#grad1)"/>
    <path d="M-8 8 Q0 12 8 8" stroke="url(#grad1)" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Cloud/Server -->
  <g transform="translate(380, 120)">
    <path d="M-50 15 Q-50 -10 -30 -10 Q-20 -10 -15 0 Q-5 -5 5 0 Q15 -5 20 0 Q30 -10 40 -10 Q55 -10 55 15 Z" fill="url(#grad2)" opacity="0.3"/>
    <path d="M-50 15 Q-50 -10 -30 -10 Q-20 -10 -15 0 Q-5 -5 5 0 Q15 -5 20 0 Q30 -10 40 -10 Q55 -10 55 15 Z" fill="none" stroke="url(#grad2)" stroke-width="2"/>
    <circle cx="-20" cy="5" r="4" fill="url(#grad2)"/>
    <circle cx="0" cy="5" r="4" fill="url(#grad2)"/>
    <circle cx="20" cy="5" r="4" fill="url(#grad2)"/>
    <rect x="-10" y="25" width="20" height="6" rx="3" fill="url(#grad2)"/>
  </g>

  <!-- Mobile Phone -->
  <g transform="translate(420, 220)">
    <rect x="-30" y="-50" width="60" height="100" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="-22" y="-40" width="44" height="80" rx="6" fill="#0a0f1a">
      <g fill="#6366f1" font-family="monospace" font-size="9" opacity="0.8">
        <text x="-18" y="-15">📱 App</text>
        <text x="-18" y="0">Running...</text>
        <text x="-18" y="15">✓ Deployed</text>
      </g>
    </rect>
    <circle cx="0" cy="55" r="6" fill="#334155"/>
  </g>

  <!-- Students/Team -->
  <g transform="translate(60, 280)">
    <!-- Student 1 -->
    <circle cx="0" cy="0" r="22" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="0" cy="-5" r="14" fill="#334155"/>
    <ellipse cx="0" cy="25" rx="16" ry="8" fill="#334155"/>
    <circle cx="-5" cy="-8" r="2" fill="#00d4aa"/>
    <circle cx="5" cy="-8" r="2" fill="#00d4aa"/>
    <path d="M-6 3 Q0 7 6 3" stroke="#00d4aa" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Student 2 -->
    <circle cx="50" cy="0" r="22" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="50" cy="-5" r="14" fill="#334155"/>
    <ellipse cx="50" cy="25" rx="16" ry="8" fill="#334155"/>
    <circle cx="45" cy="-8" r="2" fill="#6366f1"/>
    <circle cx="55" cy="-8" r="2" fill="#6366f1"/>
    <path d="M44 3 Q50 7 56 3" stroke="#6366f1" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Student 3 -->
    <circle cx="25" cy="-40" r="22" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="25" cy="-45" r="14" fill="#334155"/>
    <ellipse cx="25" cy="-15" rx="16" ry="8" fill="#334155"/>
    <circle cx="20" cy="-48" r="2" fill="#f59e0b"/>
    <circle cx="30" cy="-48" r="2" fill="#f59e0b"/>
    <path d="M19 -37 Q25 -33 31 -37" stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Connection lines -->
    <path d="M22 5 Q35 -20 48 5" stroke="url(#grad1)" stroke-width="1.5" fill="none" stroke-dasharray="5,5" opacity="0.5"/>
    <path d="M3 0 Q12 -20 23 -38" stroke="url(#grad2)" stroke-width="1.5" fill="none" stroke-dasharray="5,5" opacity="0.5"/>
    <path d="M47 0 Q38 -20 27 -38" stroke="url(#grad3)" stroke-width="1.5" fill="none" stroke-dasharray="5,5" opacity="0.5"/>
  </g>

  <!-- Code brackets floating -->
  <g transform="translate(320, 280)" opacity="0.4">
    <text x="0" y="0" font-family="monospace" font-size="48" font-weight="bold" fill="url(#grad1)">{</text>
    <text x="0" y="35" font-family="monospace" font-size="48" font-weight="bold" fill="url(#grad2)">}</text>
  </g>

  <g transform="translate(120, 50)" opacity="0.3">
    <text x="0" y="0" font-family="monospace" font-size="32" font-weight="bold" fill="url(#grad3)"></></text>
  </g>

  <!-- Particles -->
  <g fill="url(#grad1)" opacity="0.6">
    <circle cx="100" cy="50" r="3"/>
    <circle cx="400" cy="80" r="2"/>
    <circle cx="450" cy="300" r="4"/>
    <circle cx="50" cy="320" r="2"/>
    <circle cx="300" cy="20" r="3"/>
    <circle cx="200" cy="350" r="2"/>
  </g>
</svg>