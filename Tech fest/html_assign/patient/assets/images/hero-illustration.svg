<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 375" fill="none">
  <defs>
    <linearGradient id="medGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="medGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="medGrad3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <filter id="medGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background subtle pattern -->
  <rect width="500" height="375" fill="#f8fafc"/>

  <!-- Central medical team illustration -->
  <g transform="translate(140, 60)">
    <!-- Doctor 1 -->
    <circle cx="0" cy="0" r="50" fill="url(#medGrad1)" opacity="0.15"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#medGrad1)" stroke-width="1.5"/>

    <!-- Doctor figure -->
    <ellipse cx="0" cy="-15" rx="18" ry="22" fill="#e2e8f0"/>
    <circle cx="0" cy="-38" r="14" fill="#fdf4e3"/>
    <ellipse cx="0" cy="-38" rx="16" ry="4" fill="#0d9488" opacity="0.3"/>
    <circle cx="-5" cy="-40" r="2" fill="#1e293b"/>
    <circle cx="5" cy="-40" r="2" fill="#1e293b"/>
    <path d="M-5 -33 Q0 -30 5 -33" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <rect x="-15" y="-10" width="30" height="25" rx="3" fill="#0d9488"/>
    <rect x="-8" y="-8" width="16" height="12" rx="2" fill="white" opacity="0.3"/>
    <path d="M-5 5 L-5 20 M5 5 L5 20" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
    <path d="M-15 20 L-15 35 M15 20 L15 35" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-5" cy="25" r="3" fill="#0d9488"/>
    <circle cx="5" cy="25" r="3" fill="#0d9488"/>

    <!-- Stethoscope -->
    <path d="M20 -25 Q35 -40 35 -45 Q40 -45 40 -35 Q40 -25 25 -15" stroke="url(#medGrad1)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="40" cy="-45" r="5" fill="url(#medGrad1)"/>
    <circle cx="40" cy="-45" r="2" fill="white"/>
  </g>

  <!-- Doctor 2 -->
  <g transform="translate(360, 100)">
    <circle cx="0" cy="0" r="50" fill="url(#medGrad2)" opacity="0.15"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#medGrad2)" stroke-width="1.5"/>

    <ellipse cx="0" cy="-10" rx="18" ry="22" fill="#e2e8f0"/>
    <circle cx="0" cy="-33" r="14" fill="#fdf4e3"/>
    <circle cx="0" cy="-33" r="16" fill="#2563eb" opacity="0.2"/>
    <circle cx="-5" cy="-35" r="2" fill="#1e293b"/>
    <circle cx="5" cy="-35" r="2" fill="#1e293b"/>
    <path d="M-5 -28 Q0 -25 5 -28" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <rect x="-15" y="-5" width="30" height="25" rx="3" fill="#2563eb"/>
    <rect x="-8" y="-3" width="16" height="12" rx="2" fill="white" opacity="0.3"/>
    <path d="M-5 10 L-5 25 M5 10 L5 25" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
    <path d="M-15 25 L-15 40 M15 25 L15 40" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-5" cy="30" r="3" fill="#2563eb"/>
    <circle cx="5" cy="30" r="3" fill="#2563eb"/>

    <!-- Clipboard -->
    <rect x="30" y="-15" width="28" height="36" rx="2" fill="white" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="33" y="-10" width="22" height="28" rx="1" fill="#f8fafc"/>
    <path d="M36 -5 L50 -5 M36 0 L48 0 M36 5 L50 5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="40" cy="-22" r="3" fill="#2563eb"/>
  </g>

  <!-- Patient in bed -->
  <g transform="translate(200, 260)">
    <!-- Hospital bed -->
    <rect x="-60" y="0" width="120" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="-65" y="8" width="130" height="60" rx="0 0 8 8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="-55" y="12" width="110" height="20" rx="4" fill="white" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="-55" y1="22" x2="55" y2="22" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="-55" y1="32" x2="55" y2="32" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5,5"/>

    <!-- Bed rails -->
    <rect x="-70" y="8" width="6" height="40" rx="3" fill="#94a3b8"/>
    <rect x="64" y="8" width="6" height="40" rx="3" fill="#94a3b8"/>
    <line x1="-67" y1="15" x2="-67" y2="42" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="-67" y1="20" x2="-67" y2="47" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="67" y1="15" x2="67" y2="42" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="67" y1="20" x2="67" y2="47" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Patient -->
    <ellipse cx="0" cy="18" rx="22" ry="8" fill="#fdf4e3"/>
    <circle cx="0" cy="2" r="16" fill="#fdf4e3"/>
    <circle cx="-5" cy="-2" r="2.5" fill="#1e293b"/>
    <circle cx="5" cy="-2" r="2.5" fill="#1e293b"/>
    <path d="M-6 5 Q0 8 6 5" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="0" cy="22" rx="24" ry="12" fill="#0d9488" opacity="0.2"/>

    <!-- IV stand -->
    <line x1="75" y1="0" x2="75" y2="-40" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="70" y1="-40" x2="85" y2="-40" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="85" cy="-35" r="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="85" y1="-27" x2="85" y2="15" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-dasharray="3,3"/>
    <path d="M-50 10 Q-60 0 -55 -10" stroke="#0d9488" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="-55" cy="-10" r="4" fill="#0d9488"/>
  </g>

  <!-- Medical equipment floating -->
  <g transform="translate(420, 200)" opacity="0.4">
    <!-- Heart monitor -->
    <rect x="0" y="0" width="60" height="30" rx="4" fill="#1e293b" stroke="#0d9488" stroke-width="1.5"/>
    <rect x="4" y="4" width="52" height="22" rx="2" fill="#064e3b"/>
    <path d="M8 15 Q14 5 20 15 Q24 25 30 15 Q34 5 40 15 Q44 25 50 15" stroke="#0d9488" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="20" cy="15" r="2" fill="#0d9488"/>
    <text x="30" y="22" font-family="monospace" font-size="10" fill="#0d9488">82</text>
  </g>

  <g transform="translate(50, 80)" opacity="0.3">
    <!-- Medical cross -->
    <rect x="-8" y="0" width="16" height="40" rx="4" fill="url(#medGrad1)"/>
    <rect x="-24" y="12" width="48" height="16" rx="4" fill="url(#medGrad1)"/>
  </g>

  <g transform="translate(30, 180)" opacity="0.4">
    <!-- Syringe -->
    <rect x="0" y="0" width="8" height="40" rx="2" fill="#e2e8f0"/>
    <rect x="-2" y="40" width="12" height="8" rx="2" fill="#cbd5e1"/>
    <rect x="1" y="4" width="6" height="32" rx="1" fill="#bfdbfe"/>
    <line x1="4" y1="4" x2="4" y2="36" stroke="#3b82f6" stroke-width="1" stroke-dasharray="2,2"/>
  </g>

  <!-- Floating particles -->
  <g fill="url(#medGrad1)" opacity="0.4">
    <circle cx="80" cy="50" r="3"/>
    <circle cx="430" cy="60" r="2"/>
    <circle cx="470" cy="320" r="4"/>
    <circle cx="60" cy="330" r="2"/>
    <circle cx="280" cy="30" r="3"/>
    <circle cx="180" cy="350" r="2"/>
  </g>

  <!-- Subtle medical icons background -->
  <g opacity="0.05">
    <g transform="translate(100, 100)">
      <path d="M12 2L2 7l10 5 10-5-10-5z" fill="url(#medGrad1)"/>
      <path d="M2 17l10 5 10-5" fill="url(#medGrad1)"/>
      <path d="M2 12l10 5 10-5" fill="url(#medGrad1)"/>
    </g>
    <g transform="translate(400, 280)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="url(#medGrad2)" stroke-width="1"/>
      <path d="M0 -15v30M-15 0h30" stroke="url(#medGrad2)" stroke-width="1"/>
    </g>
    <g transform="translate(250, 50)">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="none" stroke="url(#medGrad3)" stroke-width="1"/>
    </g>
  </g>
</svg>