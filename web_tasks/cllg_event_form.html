
<!DOCTYPE html>
<html>
<head>
    <title>College Event Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #16002b, #35105c, #111827);
            margin: 0;
            padding: 30px 10px;
            color: white;
        }

        .container {
            max-width: 650px;
            margin: auto;
            padding: 30px;
            background: #24123d;
            border-radius: 18px;
            box-shadow: 0 0 25px rgba(180, 90, 255, 0.3);
        }

        h1 {
            text-align: center;
            color: #d8a4ff;
        }

        .subtitle {
            text-align: center;
            color: #c7b5d8;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            box-sizing: border-box;
            background: #eee6f7;
            color: #222;
        }

        .events {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }

        .events label {
            background: #382052;
            padding: 12px;
            border-radius: 8px;
            margin: 0;
            font-weight: normal;
        }

        .events input {
            width: auto;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: linear-gradient(90deg, #a855f7, #ec4899);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .summary {
            background: #382052;
            padding: 15px;
            margin-top: 20px;
            border-radius: 10px;
            color: #e9d5ff;
        }

        .hidden {
            display: none;
        }

        #message {
            text-align: center;
            color: #86efac;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎉 College Fest 2026</h1>
    <p class="subtitle">Register now and be a part of the celebration!</p>

    <form id="eventForm">

        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label>Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label>Mobile Number</label>
        <input type="tel" id="mobile"
               placeholder="10 digit mobile number"
               pattern="[0-9]{10}" required>

        <label>College Name</label>
        <input type="text" id="college" placeholder="Enter college name" required>

        <label>Gender</label>
        <select id="gender" required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <label>Participation Type</label>
        <select id="category" required>
            <option value="0">Select Category</option>
            <option value="100">Individual - ₹100</option>
            <option value="250">Group - ₹250</option>
            <option value="150">Guest - ₹150</option>
        </select>

        <label>Select Events</label>

        <div class="events">
            <label>
                <input type="checkbox" class="event" value="100">
                Singing - ₹100
            </label>

            <label>
                <input type="checkbox" class="event" value="150">
                Dancing - ₹150
            </label>

            <label>
                <input type="checkbox" class="event" value="200">
                Coding - ₹200
            </label>

            <label>
                <input type="checkbox" class="event" value="100">
                Quiz - ₹100
            </label>

            <label>
                <input type="checkbox" class="event" value="250">
                Gaming - ₹250
            </label>

            <label>
                <input type="checkbox" class="event" value="150">
                Photography - ₹150
            </label>
        </div>

        <label>Food Preference</label>
        <select id="food">
            <option>Vegetarian</option>
            <option>Non-Vegetarian</option>
            <option>Vegan</option>
        </select>

        <label>T-Shirt Size</label>
        <select id="size">
            <option value="">Select Size</option>
            <option>Small</option>
            <option>Medium</option>
            <option>Large</option>
            <option>XL</option>
            <option>XXL</option>
        </select>

        <label>Why do you want to participate?</label>
        <textarea id="reason" rows="3"
                  placeholder="Tell us something about yourself..."></textarea>

        <div class="summary">
            <h3>Registration Summary</h3>
            <p>Selected Events: <span id="count">0</span></p>
            <p>Participation Fee: ₹<span id="categoryFee">0</span></p>
            <p>Event Fee: ₹<span id="eventFee">0</span></p>
            <hr>
            <h3>Total Amount: ₹<span id="total">0</span></h3>
        </div>

        <button type="submit">Register Now</button>

        <p id="message"></p>

    </form>

</div>

<script>

    const category = document.getElementById("category");
    const events = document.querySelectorAll(".event");

    function calculateFee() {

        let eventTotal = 0;
        let count = 0;

        events.forEach(function(event) {

            if (event.checked) {
                eventTotal += Number(event.value);
                count++;
            }

        });

        let categoryFee = Number(category.value);
        let total = categoryFee + eventTotal;

        document.getElementById("count").innerText = count;
        document.getElementById("categoryFee").innerText = categoryFee;
        document.getElementById("eventFee").innerText = eventTotal;
        document.getElementById("total").innerText = total;

    }

    category.addEventListener("change", calculateFee);

    events.forEach(function(event) {
        event.addEventListener("change", calculateFee);
    });

    document.getElementById("eventForm").addEventListener("submit",
        function(e) {

            e.preventDefault();

            if (document.querySelectorAll(".event:checked").length === 0) {
                document.getElementById("message").innerText =
                    "Please select at least one event!";
                return;
            }

            document.getElementById("message").innerText =
                "🎉 Registration Successful! Thank you for participating.";

        }
    );

</script>

</body>
</html>
